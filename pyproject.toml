[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanshift"
version = "0.1.2"
description = "Schema migration tool for Google Cloud Spanner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-spanner>=3.40.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/last-brain-cell/spanshift"
Repository = "https://github.com/last-brain-cell/spanshift"
Issues = "https://github.com/last-brain-cell/spanshift/issues"

[project.scripts]
spanshift = "spanshift.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spanshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
